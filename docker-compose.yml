version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: abm-backend
    env_file:
      - backend/.env
    ports:
      - "3001:3001"
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: abm-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
